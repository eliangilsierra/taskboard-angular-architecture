# Long-lived caching only for content-hashed build output; everything else is revalidated.
map $uri $cache_control {
  default "no-cache";
  "~^/[^/]+-[A-Za-z0-9]{8}\.(js|css)$" "public, max-age=31536000, immutable";
}

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header Cache-Control $cache_control always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # A missing file must be a 404, not the application shell.
  location ~* \.[a-z0-9]+$ {
    try_files $uri =404;
  }

  # Client-side routes fall back to the application shell.
  location / {
    try_files $uri /index.html;
  }
}
