<form class="task-form" (submit)="onSubmit($event)">
  <input
    type="text"
    name="title"
    placeholder="What needs to be done?"
    aria-label="Task title"
    autocomplete="off"
    [maxLength]="maxLength"
    [value]="title()"
    (input)="onInput($event)"
  />
  <button type="submit" [disabled]="!canSubmit()">Add</button>
</form>
