<ul class="task-list">
  @for (task of tasks(); track task.id) {
    <li class="task-list__item" [class.task-list__item--done]="task.done">
      <label>
        <input type="checkbox" [checked]="task.done" (change)="toggled.emit(task.id)" />
        <span>{{ task.title }}</span>
      </label>
      <button type="button" [attr.aria-label]="'Remove ' + task.title" (click)="removed.emit(task.id)">
        Remove
      </button>
    </li>
  } @empty {
    <li class="task-list__empty">Nothing to do yet.</li>
  }
</ul>
